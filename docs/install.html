<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Install AuraSolve from the Chrome Web Store.">
  <meta name="theme-color" content="#ffffff">
  <title>Install AuraSolve</title>
  <link rel="icon" type="image/png" href="icon.png?v=3">
  <link rel="apple-touch-icon" href="icon.png?v=3">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=65">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="AuraSolve home">
      <img src="icon.png?v=3" alt="" width="28" height="28">
      <span>AuraSolve</span>
    </a>
    <nav class="nav-center" aria-label="Sections">
      <a href="index.html#how">How it works</a>
      <a href="index.html#features">Features</a>
      <a href="index.html#faq">FAQ</a>
    </nav>
    <div class="topbar-actions">
      <button class="nav-signin" id="nav-account" type="button">Sign in</button>
      <a class="btn btn-primary btn-sm" href="login.html">Get started</a>
    </div>
  </header>

  <main class="login-wrap under-bar">
    <section class="login-card">
      <span class="chip" id="chip">Chrome Web Store</span>
      <h1 id="title" style="margin-top:18px">Install AuraSolve</h1>
      <p class="lead" id="lead">Add AuraSolve to Chrome, then sign in inside the extension with this account.</p>
      <div class="stack">
        <a class="btn btn-primary btn-lg" id="primary" href="https://chromewebstore.google.com/detail/aurasolve/fmmkeamfcjpnmjcbgmmofejajeeogncm" target="_blank" rel="noopener">Add to Chrome</a>
        <button class="btn btn-ghost btn-lg" id="logout" type="button" hidden>Log out</button>
        <a class="btn btn-ghost btn-lg" id="secondary" href="login.html">Sign in</a>
      </div>
    </section>
  </main>
  <script src="nav.js?v=1"></script>
  <script src="analytics.js?v=5"></script>
  <script>
    const paid = new URLSearchParams(location.search).get("paid") === "1";
    if (paid) {
      document.getElementById("chip").textContent = "Ready";
      document.getElementById("title").textContent = "Add the extension";
      document.getElementById("lead").textContent = "Install AuraSolve, then sign in inside the extension with this account.";
    }
    const logout = document.getElementById("logout");
    const secondary = document.getElementById("secondary");
    fetch("/api/v1/auth/session", {credentials: "same-origin"}).then(r => r.json()).then(data => {
      if (!data?.signedIn) return;
      logout.hidden = false;
      secondary.hidden = true;
      if (data.email) document.getElementById("lead").textContent = `Signed in as ${data.email}. Install AuraSolve, then sign in inside the extension.`;
    }).catch(() => {});
    logout.onclick = async () => {
      logout.disabled = true;
      try {
        await fetch("/api/v1/auth/web/logout", {method: "POST", credentials: "same-origin", headers: {"Content-Type": "application/json"}, body: "{}"});
      } catch {}
      location.assign("/login");
    };
  </script>
</body>
</html>
