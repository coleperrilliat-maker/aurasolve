<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Forms practice</title>
<style>body{margin:0;font:16px/1.45 system-ui,sans-serif;background:#f0ebf8;color:#202124}main{max-width:640px;margin:24px auto;padding:0 16px 80px}.q{background:#fff;border-radius:8px;padding:24px;margin:16px 0;box-shadow:0 1px 2px #0002}h2{font-size:18px;margin:0 0 16px}.opt{display:flex;gap:10px;align-items:center;margin:10px 0;cursor:pointer}[role="radio"],[role="checkbox"]{width:18px;height:18px;border:2px solid #5f6368;border-radius:50%;display:inline-block}[role="checkbox"]{border-radius:3px}[aria-checked="true"]{background:#673ab7;border-color:#673ab7}svg{display:block;margin:12px 0;max-width:100%}</style></head>
<body><main>
  <div class="q" role="listitem" data-id="1">
    <h2 role="heading" aria-level="3"><span>What is 2 + 2?</span></h2>
    <div role="radiogroup">
      <label class="opt"><div role="radio" data-value="3" aria-checked="false" tabindex="0"></div><span>3</span></label>
      <label class="opt"><div role="radio" data-value="4" aria-checked="false" tabindex="0"></div><span>4</span></label>
      <label class="opt"><div role="radio" data-value="5" aria-checked="false" tabindex="0"></div><span>5</span></label>
    </div>
  </div>
  <div class="q" role="listitem" data-id="2">
    <h2 role="heading" aria-level="3"><span>Select all prime numbers</span></h2>
    <div role="group">
      <label class="opt"><div role="checkbox" data-answer-value="2" aria-checked="false" tabindex="0"></div><span>2</span></label>
      <label class="opt"><div role="checkbox" data-answer-value="3" aria-checked="false" tabindex="0"></div><span>3</span></label>
      <label class="opt"><div role="checkbox" data-answer-value="4" aria-checked="false" tabindex="0"></div><span>4</span></label>
      <label class="opt"><div role="checkbox" data-answer-value="9" aria-checked="false" tabindex="0"></div><span>9</span></label>
    </div>
  </div>
  <div class="q" role="listitem" data-id="3">
    <h2 role="heading" aria-level="3"><span>How many sides does the shape have?</span></h2>
    <svg width="160" height="140" viewBox="0 0 160 140" aria-label="triangle diagram"><polygon points="80,10 150,130 10,130" fill="#d1c4e9" stroke="#4527a0" stroke-width="3"/></svg>
    <div role="radiogroup">
      <label class="opt"><div role="radio" data-value="3" aria-checked="false" tabindex="0"></div><span>3</span></label>
      <label class="opt"><div role="radio" data-value="4" aria-checked="false" tabindex="0"></div><span>4</span></label>
      <label class="opt"><div role="radio" data-value="5" aria-checked="false" tabindex="0"></div><span>5</span></label>
    </div>
  </div>
</main>
<script>
document.addEventListener('click',e=>{
  const t=e.target.closest('[role="radio"],[role="checkbox"]'); if(!t)return;
  if(t.getAttribute('role')==='radio'){ t.closest('[role="radiogroup"]').querySelectorAll('[role="radio"]').forEach(r=>r.setAttribute('aria-checked','false')); t.setAttribute('aria-checked','true'); }
  else t.setAttribute('aria-checked', t.getAttribute('aria-checked')==='true'?'false':'true');
});
</script></body></html>
