<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AuraSolve</title>
  <link rel="stylesheet" href="mini.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="../../icons/icon-48.png" alt="" width="20" height="20">
      <span>AuraSolve</span>
    </div>
    <p class="hint">Open with <kbd>⌘</kbd><kbd>⇧</kbd><kbd>X</kbd></p>
  </header>

  <div id="site-access" class="access" role="alert" hidden>
    <span>Chrome is blocking AuraSolve on your homework sites.</span>
    <button id="allow-sites" type="button">Allow</button>
  </div>

  <button id="pilot" class="panel primary" type="button">
    <span id="pilot-title">Start AutoPilot</span>
    <small id="pilot-text">Works through unfinished questions</small>
  </button>

  <div class="row">
    <button id="solve" class="panel" type="button">Solve this</button>
    <button id="shot" class="panel" type="button">Screenshot</button>
  </div>

  <button id="chat" class="panel slim" type="button">Chat</button>

  <div class="panel switch-row">
    <span>
      <em>Anonymous</em>
      <small id="ghost-state">Buttons stay clickable, but invisible</small>
    </span>
    <button id="ghost" class="switch" type="button" role="switch" aria-checked="false" aria-label="Anonymous mode"></button>
  </div>

  <button id="remove" class="panel slim mute" type="button">Remove page buttons</button>

  <p id="note" class="note" aria-live="polite"></p>

  <footer class="foot">
    <button id="profile" class="profile" type="button">
      <span class="avatar" aria-hidden="true"></span>
      <span>
        <em>Profile</em>
        <small id="profile-text">Account &amp; plan</small>
      </span>
    </button>
    <small id="version"></small>
  </footer>

  <script type="module" src="mini.js"></script>
</body>
</html>
