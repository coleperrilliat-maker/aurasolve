<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AuraSolve</title>
  <link rel="stylesheet" href="../vendor/katex/katex.min.css">
  <link rel="stylesheet" href="../shared/loader.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <span class="brand"><img src="../../icons/icon-48.png" alt="" width="22" height="22"><strong>AuraSolve</strong></span>
    <button id="close" type="button">Close</button>
  </header>
  <small id="cloud">Checking cloud…</small>
  <div class="modes">
    <button data-mode="autopilot" type="button">AutoPilot</button>
    <button data-mode="explain" type="button">Explain now</button>
  </div>
  <p id="status" role="status">Open a practice question, then choose a mode.</p>
  <section id="consent" hidden>
    <p class="honor">Honor code: type <b id="phrase"></b></p>
    <input id="statement" type="text" maxlength="120" autocomplete="off" spellcheck="false">
    <input id="signature" type="text" maxlength="100" placeholder="Sign your name" autocomplete="off">
    <button id="confirm" type="button" class="primary" disabled>Sign & continue</button>
  </section>
  <div class="loader-wrap" id="loader" hidden aria-hidden="true"><div class="spinner"></div></div>
  <button id="stop" type="button" class="stop" hidden>Stop</button>
  <div id="results"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
